name: ERW E2E (Deterministic)
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'crates/but-engineering-rewrite/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [master]
    paths:
      - 'crates/but-engineering-rewrite/**'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    # Nightly on default branch to catch regressions even without ERW file churn.
    - cron: '41 6 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: erw-e2e-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/gitbutlerapp/ci-base-image:latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [smoke, collision, discovery, triangle, drift, drift_v2]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
        with:
          shared-key: erw-e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Run E2E (no agents)
        run: ./crates/but-engineering-rewrite/e2e/run.sh --no-agents --scenario "${{ matrix.scenario }}" --timebox-s 120 --out-dir "${{ runner.temp }}/erw-e2e-${{ matrix.scenario }}"
      - name: Upload E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erw-e2e-out-${{ matrix.scenario }}
          path: ${{ runner.temp }}/erw-e2e-${{ matrix.scenario }}
          retention-days: 7
          if-no-files-found: error
